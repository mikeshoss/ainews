name: Watchdog — did today's edition publish?

# The briefing is written by a Claude routine that can fail silently: hit a usage limit, crash mid-run,
# or push nothing. The deploy workflow still succeeds (it just rebuilds yesterday's site), so nothing
# says anything is wrong. This workflow is the alarm, and it runs on GitHub's scheduler — no Claude
# quota, no secrets, nothing that can be exhausted by the thing it is watching.
#
# It checks three things for today: the edition file is committed, the page is live on the site, and
# the edition is not suspiciously thin. On a miss it fails, which is what raises the alarm: GitHub
# emails the repo owner when a scheduled workflow fails, and the job summary carries the diagnosis.
# The repository is public, so it does NOT open an issue by default — a public "we missed a day"
# notice is not something to publish by accident. Set the repository variable WATCHDOG_ISSUE to
# "true" (Settings → Secrets and variables → Actions → Variables) to have it open and auto-close a
# tracked `watchdog` issue as well.
#
# Mondays additionally require the week in review.

on:
  schedule:
    # UTC. The daily routine fires 11:00 UTC and takes ~40 minutes; the weekly fires 13:00 UTC Mondays.
    - cron: '20 13 * * *'   # first check — 09:20 ET (08:20 in winter)
    - cron: '20 17 * * *'   # second check, after the safety-net deploy
    - cron: '20 23 * * *'   # last call before the day is gone
  workflow_dispatch:
    inputs:
      date:
        description: 'Check this date instead of today (YYYY-MM-DD)'
        required: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Look for today's edition
        env:
          FORCE_DATE: ${{ github.event.inputs.date }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          D="${FORCE_DATE:-$(TZ=America/Toronto date +%F)}"
          DOW=$(TZ=America/Toronto date -d "$D" +%u)   # 1 = Monday
          echo "date=$D" >> "$GITHUB_OUTPUT"
          problems=""
          note() { problems="${problems}- ${1}"$'\n'; }

          # 1. Is the edition committed?
          if [ -f "data/$D.json" ]; then
            items=$(node -e "const e=require('./data/$D.json');console.log((e.sections||[]).reduce((a,s)=>a+((s.items||[]).length),0))")
            echo "edition present: $items items"
            # A healthy run keeps 12-30 items; under 8 means the run degraded partway through.
            if [ "$items" -lt 8 ]; then
              note "The edition published with only $items items (a normal day is 12-30) - the run degraded partway through."
            fi
          else
            note "\`data/$D.json\` is missing: the daily routine did not publish an edition."
          fi

          # 2. Is Monday's week in review committed?
          if [ "$DOW" = "1" ] && [ ! -f "data/$D.week.json" ]; then
            note "\`data/$D.week.json\` is missing: the Monday week-in-review routine did not publish."
          fi

          # 3. Is the page actually live? (The edition can be committed and the deploy still be broken.)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://aiedgebriefing.com/$D/" || echo 000)
          if [ "$code" != "200" ]; then
            note "https://aiedgebriefing.com/$D/ returns HTTP $code - the edition is not live on the site."
          fi

          # 4. Does today's episode exist? (The build deploys the page even when the podcast step fails.)
          # The 13:20 UTC check runs too soon after an 11:00 edition on a slow TTS day; only the later checks report it.
          if [ "$(date -u +%H)" -ge 16 ] && [ "$code" = "200" ]; then
            ep=$(curl -s --max-time 30 https://audio.aiedgebriefing.com/index.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j.episodes['$D']?'yes':(j.pending&&j.pending['$D'])?'pending':'no')}catch{process.stdout.write('unknown')}})")
            echo "episode present: $ep"
            if [ "$ep" = "pending" ]; then
              note "The $D episode is still waiting for your approval - open the review link in this morning's email to put it live."
            elif [ "$ep" != "yes" ]; then
              note "No podcast episode for $D - the page is live but the audio step failed (see the deploy runs' warnings)."
            fi
          fi

          # 5. Is the publish pipeline stuck? Deploys share one concurrency group ("pages"), so a single run that
          # never finishes holds every later deploy in the queue, and each newer one cancels the one before it.
          # 2026-11-05 to 11-13: one deploy job sat "waiting" for eight days and nothing reached the site.
          # Ask per status: a stuck run can be older than the newest 50 runs (it was 45 runs back on 11-13).
          stuck=""
          for st in queued waiting pending in_progress; do
            s=$(gh run list --workflow deploy.yml --status "$st" --limit 20 --json databaseId,createdAt \
                  --jq '[.[] | select((now - (.createdAt|fromdateiso8601)) > 5400) | "\(.databaseId) since \(.createdAt)"] | join(", ")' 2>/dev/null || true)
            [ -n "$s" ] && stuck="${stuck:+$stuck, }$s ($st)"
          done
          if [ -n "$stuck" ]; then
            note "Publishing is STUCK: deploy run(s) $stuck have not finished after 90+ minutes and block every later deploy. Cancel them: gh run cancel <id> -R $GITHUB_REPOSITORY"
          fi

          if [ -n "$problems" ]; then
            { echo "problems<<WATCHDOG_EOF"; printf '%s' "$problems"; echo "WATCHDOG_EOF"; } >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise the alarm
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.check.outputs.date }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          WANT_ISSUE: ${{ vars.WATCHDOG_ISSUE }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          set -eu
          TITLE="No edition published for $D"
          {
            printf '%s\n\n' "## $TITLE"
            printf '%s\n' "$PROBLEMS"
            printf '%s\n\n' "**What to check, in order**"
            printf '%s\n' "1. The routine's last run at https://claude.ai/code — \`trig_01YaKywNA88XkG8NgK8f6DEv\` (daily), \`trig_01MgeNtEsNVrv5qhVFMKa3N1\` (catch-up) or \`trig_01QQbwNzH1YtgNoj9LKAwX18\` (Monday weekly). A run that dies in the first few minutes is almost always a usage limit; one that dies late is usually a source or a validator."
            printf '%s\n' "2. Usage and limits: https://claude.ai/settings/usage"
            printf '%s\n\n' "3. Workflow logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
            printf '%s\n' "To publish late once the cause is fixed, fire the daily routine again — it writes the edition from scratch."
          } > /tmp/watchdog-body.md

          # Phone alarm (ntfy). The failed-run email alone was missed for eight days (2026-11-05 to 11-13) because
          # the routine's own morning email kept arriving and looked normal. Set the repository SECRET
          # NTFY_URL to the full topic URL (https://ntfy.sh/<topic>); unset = this step is skipped.
          if [ -n "${NTFY_URL:-}" ]; then
            curl -s --max-time 20 -H "Title: AI Edge: $D not live" -H "Priority: high" -H "Tags: warning" \
                 -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                 --data-binary "$PROBLEMS" "$NTFY_URL" >/dev/null || echo "::warning::ntfy post failed"
          fi

          # Primary alarm: the job summary plus a failed scheduled run, which GitHub emails to the owner.
          cat /tmp/watchdog-body.md >> "$GITHUB_STEP_SUMMARY"

          # Optional, off by default: a tracked issue. The repo is public, so this is opt-in.
          if [ "${WANT_ISSUE:-}" = "true" ]; then
            NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label watchdog --search "$TITLE in:title" --json number,title \
                   --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
            if [ -n "${NUM:-}" ]; then
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/watchdog-body.md
            else
              gh label create watchdog --repo "$GITHUB_REPOSITORY" --color B60205 --description "Automated pipeline alarm" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label watchdog --body-file /tmp/watchdog-body.md
            fi
          fi
          echo "::error::$TITLE"
          exit 1

      - name: All clear — close any open alarm for today
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.check.outputs.date }}
          WANT_ISSUE: ${{ vars.WATCHDOG_ISSUE }}
        run: |
          set -eu
          [ "${WANT_ISSUE:-}" = "true" ] || { echo "$D: edition committed and live."; exit 0; }
          TITLE="No edition published for $D"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label watchdog --search "$TITLE in:title" --json number,title \
                 --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "${NUM:-}" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "The $D edition is committed and live. Closing."
          fi
          echo "$D: edition committed and live."
