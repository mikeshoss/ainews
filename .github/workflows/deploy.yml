name: Build, podcast and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'   # safety net: fill any missing episode at 08:00 ET
  workflow_dispatch:

permissions:
  contents: write   # upload podcast MP3s to the "audio" release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate all editions
        run: |
          set -e
          for f in data/*-[0-9][0-9].json; do [ -e "$f" ] && node scripts/validate.js "$f"; done || true
      - name: Install ffmpeg and ImageMagick
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core >/dev/null
      - name: Generate podcast episodes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/podcast.js
      - name: Build site
        run: node scripts/build.js
      - name: Podcast cover
        run: scripts/cover.sh site/cover.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
