name: Build, podcast and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'   # safety net: fill any missing episode at 08:00 ET
  workflow_dispatch:
    inputs:
      force_date:
        description: 'Regenerate this edition''s episode (YYYY-MM-DD)'
        required: false
      label:
        description: 'Version label for the regenerated episode (e.g. v2); earlier versions are kept'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# Production configuration, in one place. Both build steps below inherit it. The staging preview
# (staging.yml) sets its own SITE_ENV/SITE_URL and deliberately none of the rest.
env:
  SITE_ENV: production
  SITE_URL: https://aiedgebriefing.com
  GA_MEASUREMENT_ID: G-WGF9BW5QXC
  SUBSCRIBE_FORM_URL: ${{ vars.SUBSCRIBE_FORM_URL }}
  SITE_FEATURES: ${{ vars.SITE_FEATURES }}
  INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only main. If the trigger is ever widened, this still keeps podcast.js (TTS spend, rewrites the live
    # R2 index) and the Pages artifact off every other branch. Schedule and dispatch runs are on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate all editions
        run: |
          set -e
          for f in data/*-[0-9][0-9].json; do [ -e "$f" ] && node scripts/validate.js "$f"; done || true
          for f in data/*.week.json; do [ -e "$f" ] && node scripts/validate-week.js "$f"; done || true
          node scripts/validate-storyline.js || true
      - name: Install ffmpeg and librsvg
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-dejavu-core >/dev/null
      - name: Generate podcast episodes
        if: github.ref == 'refs/heads/main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AUDIO_BASE: ${{ vars.AUDIO_BASE }}
          FORCE_DATE: ${{ github.event.inputs.force_date }}
          FORCE_LABEL: ${{ github.event.inputs.label }}
        # The nightly safety-net run is the moment the wait is over: narrate anything that still has no
        # dialogue script. Push-triggered runs wait, so an edition committed a minute before its script
        # is not narrated by the build that the edition's own commit started.
        run: node scripts/podcast.js ${{ github.event_name == 'schedule' && '--no-wait' || '' }}
      - name: Map episodes to Spotify (for "continue in Spotify" links)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AUDIO_BASE: ${{ vars.AUDIO_BASE }}
        run: node scripts/spotify.js || true
      - name: Build site
        run: node scripts/build.js
      - name: Site assets (cover, favicon, share image)
        run: |
          node scripts/cover.js --show site/cover.svg && scripts/rasterize.sh site/cover.svg site/cover.png
          node scripts/cover.js --favicon site/favicon.svg
          scripts/rasterize.sh site/favicon.svg site/favicon-32.png 32
          scripts/rasterize.sh site/favicon.svg site/favicon-192.png 192
          scripts/rasterize.sh site/favicon.svg site/apple-touch-icon.png 180
          node scripts/cover.js --og site/og.svg && scripts/rasterize.sh site/og.svg site/og.png 1200 630
      - uses: actions/configure-pages@v5
      - name: Keep the built emails out of the published site
        # site/email/* are build artifacts: mail.js and the routine read them from the checkout, and
        # they have already run by this point. They are not pages, and Mike's own copies carry the
        # proposed-storyline queue, which must never be reachable from the web.
        run: rm -rf site/email
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'      # actions/deploy-pages targets the ONE Pages site: the live one
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Everything that TELLS someone about the edition runs here, after the deployment above.
  # In the build job these ran before the site was published, so the first thing a subscriber, a
  # follower or a search engine got was a link to a page that did not exist yet.
  announce:
    if: github.ref == 'refs/heads/main'      # Brevo send, social posts, YouTube, R2 markers, IndexNow — never from another branch
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg and librsvg
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-dejavu-core >/dev/null
      - name: Rebuild the email bodies and the post text
        run: node scripts/build.js
      - name: Wait for the new edition to actually answer
        # deploy-pages reports success when the deployment is created; the edge can lag a little behind.
        run: |
          D=$(TZ=America/Toronto date +%F)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://aiedgebriefing.com/$D/" || echo 000)
            if [ "$code" = "200" ]; then echo "$D is live"; exit 0; fi
            sleep 10
          done
          echo "::warning::https://aiedgebriefing.com/$D/ still not 200 after 5 minutes — announcing anyway"
      - name: Send today's edition to subscribers
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AUDIO_BASE: ${{ vars.AUDIO_BASE }}
        run: node scripts/mail.js || true
      - name: Post today's edition to social accounts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AUDIO_BASE: ${{ vars.AUDIO_BASE }}
        run: node scripts/social.js || true
      - name: Publish today's episode to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AUDIO_BASE: ${{ vars.AUDIO_BASE }}
        run: node scripts/youtube.js || true
      - name: Tell search engines what changed (IndexNow)
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: node scripts/indexnow.js || true
