# One-time and occasional: create the Resend segment + topics, and deploy the subscribe Worker.
# Runs here, not on a laptop, so the full-access Resend key only ever lives in GitHub secrets.
name: Mail setup (Resend objects, subscribe Worker)
on:
  workflow_dispatch:
    inputs:
      what:
        description: "resend-objects: create the segment and topics if missing and print their IDs · worker: deploy worker/subscribe with secrets and IDs"
        type: choice
        options: [resend-objects, worker]
        required: true
permissions:
  contents: read
concurrency: mail-setup
jobs:
  resend-objects:
    if: inputs.what == 'resend-objects'
    runs-on: ubuntu-latest
    steps:
      - name: Create if missing, then print
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          [ -n "$RESEND_API_KEY" ] || { echo "::error::RESEND_API_KEY secret is not set"; exit 1; }
          api() { curl -sf -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' "$@"; }
          find_or_create() { # $1 kind (segments|topics)  $2 name  $3 create-body
            id=$(api "https://api.resend.com/$1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=(j.data||[]).find(o=>o.name===process.argv[1]);process.stdout.write(x?x.id:'')})" "$2")
            if [ -z "$id" ]; then id=$(api -X POST "https://api.resend.com/$1" -d "$3" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).id))"); echo "created $1 '$2'"; else echo "found $1 '$2'"; fi
            echo "$id"
          }
          SEG=$(find_or_create segments 'AI Edge Briefing' '{"name":"AI Edge Briefing"}' | tail -1)
          DAILY=$(find_or_create topics 'Daily briefing' '{"name":"Daily briefing","default_subscription":"opt_out","visibility":"public","description":"The morning AI Edge Briefing, every day."}' | tail -1)
          WEEKLY=$(find_or_create topics 'Weekly review' '{"name":"Weekly review","default_subscription":"opt_out","visibility":"public","description":"The Monday review of the week."}' | tail -1)
          {
            echo "## Resend objects"
            echo
            echo "Set these as repository variables (they are IDs, not secrets):"
            echo
            echo '```'
            echo "gh variable set RESEND_SEGMENT_ID --body $SEG"
            echo "gh variable set RESEND_TOPIC_DAILY --body $DAILY"
            echo "gh variable set RESEND_TOPIC_WEEKLY --body $WEEKLY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "segment=$SEG daily=$DAILY weekly=$WEEKLY"
  worker:
    if: inputs.what == 'worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check inputs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBE_SIGNING_SECRET: ${{ secrets.SUBSCRIBE_SIGNING_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ok=1
          for v in RESEND_API_KEY SUBSCRIBE_SIGNING_SECRET CLOUDFLARE_API_TOKEN; do [ -n "${!v}" ] || { echo "::error::secret $v is not set"; ok=0; }; done
          for v in RESEND_SEGMENT_ID RESEND_TOPIC_DAILY RESEND_TOPIC_WEEKLY; do [ -n "${{ vars.RESEND_SEGMENT_ID }}${{ vars.RESEND_TOPIC_DAILY }}${{ vars.RESEND_TOPIC_WEEKLY }}" ] || { echo "::error::variable $v is not set — run resend-objects first"; ok=0; break; }; done
          [ $ok = 1 ]
      - name: Deploy worker/subscribe
        working-directory: worker/subscribe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy \
            --var RESEND_SEGMENT_ID:"${{ vars.RESEND_SEGMENT_ID }}" \
            --var RESEND_TOPIC_DAILY:"${{ vars.RESEND_TOPIC_DAILY }}" \
            --var RESEND_TOPIC_WEEKLY:"${{ vars.RESEND_TOPIC_WEEKLY }}"
      - name: Set the Worker's secrets
        working-directory: worker/subscribe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.RESEND_API_KEY }}" | npx --yes wrangler@4 secret put RESEND_API_KEY
          printf '%s' "${{ secrets.SUBSCRIBE_SIGNING_SECRET }}" | npx --yes wrangler@4 secret put SUBSCRIBE_SIGNING_SECRET
      - name: Prove it answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://subscribe.aiedgebriefing.com/subscribe -H 'content-type: application/json' -H 'accept: application/json' -d '{"email":"not-an-email","daily":true}')
          echo "POST /subscribe with a bad address → HTTP $code (expected 400)"
          [ "$code" = 400 ]
          echo "Worker live at https://subscribe.aiedgebriefing.com — set: gh variable set SUBSCRIBE_URL --body https://subscribe.aiedgebriefing.com/subscribe" >> "$GITHUB_STEP_SUMMARY"
